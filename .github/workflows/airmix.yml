name: AirMix

on:
  push:
    paths: ["AirMix/**", ".github/workflows/airmix.yml"]
  workflow_dispatch:

jobs:
  portable-tests:
    name: DSP & core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    defaults: { run: { working-directory: AirMix } }
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos:
    name: Build & test (macOS)
    runs-on: macos-15
    defaults: { run: { working-directory: AirMix } }
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && swift --version
      - name: Unit tests
        run: swift test
      - name: Build AirMix.app
        run: scripts/build-app.sh
      - name: Launch smoke test (starts, stays up 5 s, quits cleanly)
        run: |
          ./dist/AirMix.app/Contents/MacOS/AirMix &
          pid=$!
          sleep 5
          kill -0 $pid
          kill -TERM $pid
          wait $pid || true
      - name: Package
        run: ditto -c -k --keepParent dist/AirMix.app dist/AirMix.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AirMix-macOS
          path: AirMix/dist/AirMix.app.zip
          retention-days: 90
