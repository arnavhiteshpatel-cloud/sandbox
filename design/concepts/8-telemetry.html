<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fx.css"><style>
.top{position:absolute;left:96px;right:24px;top:12px;height:40px;display:flex;align-items:center;gap:18px}
.crumb{font-family:'JetBrains Mono Variable';font-size:11.5px;letter-spacing:.12em;color:rgba(200,214,240,.7)}.crumb b{color:#fff;font-weight:600}
.pill{margin:0 auto;display:flex;gap:2px;padding:4px;border-radius:12px;position:relative}
.pill span{font-size:12.5px;padding:6px 14px;border-radius:9px;color:rgba(210,222,245,.6)}.pill span.on{background:rgba(127,220,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(127,220,255,.35)}
.stat{font-family:'JetBrains Mono Variable';font-size:11px;letter-spacing:.1em;color:rgba(200,214,240,.55)}.stat b{color:#e8f0ff;font-weight:500}.dot{display:inline-block;width:6px;height:6px;border-radius:6px;background:#5ef2a8;box-shadow:0 0 8px #5ef2a8;margin-right:6px}
.scr{position:absolute;top:92px;left:370px;right:370px;text-align:center;font-size:27px;line-height:1.55;letter-spacing:.03em;word-spacing:.32em;color:#f2f6ff}
.moves{position:absolute;top:184px;left:50%;transform:translateX(-50%);display:flex;gap:4px}.moves i{width:20px;height:2px;border-radius:2px;background:rgba(127,220,255,.55)}
.t{position:absolute;left:0;right:0;top:282px;text-align:center;font-size:232px;font-weight:300;letter-spacing:-.045em;line-height:1;color:#f7faff;text-shadow:0 0 60px rgba(127,220,255,.18)}
.t small{font-size:.62em;color:rgba(235,242,255,.85)}
.rul{position:absolute;left:50%;transform:translateX(-50%);top:560px}
.left{left:24px;top:76px;width:322px;bottom:24px;padding:16px 18px;display:flex;flex-direction:column}
.right{right:24px;top:76px;width:322px;bottom:24px;padding:16px 18px;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:62px 58px 1fr 52px;align-items:center;gap:8px;padding:5.5px 0;font-size:13.5px;border-bottom:1px solid rgba(160,185,235,.07)}
.row .l{font-family:'JetBrains Mono Variable';font-size:11px;color:rgba(200,214,240,.55);letter-spacing:.06em}
.row .b{color:rgba(200,214,240,.5);text-align:right;font-size:12.5px}
.bar{height:3px;border-radius:3px;background:rgba(160,185,235,.1);position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,rgba(127,220,255,.25),#7fdcff)}
.strip{position:absolute;left:370px;right:370px;bottom:24px;height:118px;padding:14px 18px}
.chips{display:flex;gap:6px;margin-top:12px;align-items:flex-end;height:58px}
.chip{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:rgba(230,238,255,.85)}
.chip i{width:100%;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,rgba(127,220,255,.55),rgba(127,220,255,.08))}
.cubebox{display:flex;justify-content:center;margin:6px 0 4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.kv div{padding:10px 12px;border-radius:12px;background:rgba(127,160,255,.05);box-shadow:inset 0 0 0 1px rgba(160,185,235,.08)}.kv b{display:block;font-size:20px;font-weight:450;margin-top:3px}
.glass{border-radius:8px;background:linear-gradient(180deg,rgba(20,18,14,.8),rgba(10,9,8,.8)) padding-box,linear-gradient(150deg,rgba(255,190,100,.35),rgba(255,190,100,.05) 40%,rgba(255,190,100,.18)) border-box}
.bg{background:radial-gradient(1100px 700px at 50% 42%,#14110c 0%,#070605 60%,#000 100%)}.grid{background-image:linear-gradient(rgba(255,190,100,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,190,100,.05) 1px,transparent 1px)}
.cap{color:rgba(255,205,140,.55)}.pill span.on{background:rgba(255,181,71,.13);box-shadow:inset 0 0 0 1px rgba(255,181,71,.45)}
.t{font-family:'JetBrains Mono Variable';font-weight:300;letter-spacing:-.06em;font-size:200px;top:300px;text-shadow:0 0 60px rgba(255,181,71,.2)}
.bar i{background:linear-gradient(90deg,rgba(255,181,71,.2),#ffb547)}.chip i{background:linear-gradient(180deg,rgba(255,181,71,.6),rgba(255,181,71,.06))}.moves i{background:rgba(255,181,71,.6)}
.row .l{color:rgba(255,205,140,.55)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="tl"><i></i><i></i><i></i></div>
<div class="top"><div class="crumb"><b>SESSION 1</b> / 3×3 / WCA</div>
<div class="pill glass" style="position:relative;border-radius:12px"><span class="on">Timer</span><span>History</span><span>Analytics</span><span>Training</span><span>Sessions</span><span>Settings</span></div>
<div class="stat"><span class="dot"></span>19,043 SOLVES · MEAN <b>17.47</b></div></div>
<div class="glass left"><div class="cap">Scramble state</div><div class="cubebox" id="cube"></div><div class="cap" style="margin-top:4px">Net</div><div style="display:flex;justify-content:center;margin-top:10px" id="net"></div>
<div class="kv"><div><span class="cap">Moves</span><b>20</b></div><div><span class="cap">Inspection</span><b>15 s</b></div><div><span class="cap">Today</span><b>146</b></div><div><span class="cap">Session σ</span><b>1.42</b></div></div><div style="margin-top:auto" class="cap">Space · inspect</div></div>
<div class="scr mono" id="scr"></div>
<div class="moves" id="mv"></div>
<div class="t">12.<small>93</small></div>
<div class="rul" id="rul"></div>
<div class="glass right"><div class="cap" style="display:flex;justify-content:space-between"><span>Averages</span><span>cur · best</span></div><div id="rows" style="margin-top:8px"></div>
<div class="cap" style="margin-top:16px">Trend · last 200</div><div id="ch" style="margin-top:8px"></div></div>
<div class="glass strip"><div class="cap" style="display:flex;justify-content:space-between"><span>Recent</span><span>ao5 12.92 · ao12 13.43</span></div><div class="chips" id="chips"></div></div>
<script type="module">import {SCRAMBLE,STATS,RECENT,netSVG,chartSVG,cube3d,ruler} from "./fx.js";
scr.textContent=SCRAMBLE; mv.innerHTML=SCRAMBLE.split(" ").map(()=>"<i></i>").join("");
net.innerHTML=netSVG(12); cube3d(cube,250);
rul.innerHTML=ruler(700,[["PB",8.5],["AO5",12.92],["AO12",13.43],["AO100",14.34]],12.93,{color:"#ffb547"});
rows.innerHTML=STATS.map(([l,c,b])=>{const pct=Math.max(8,100-(parseFloat(c)-parseFloat(b))*55);return `<div class="row"><span class="l">${l.toUpperCase()}</span><span>${c}</span><div class="bar"><i style="width:${pct}%"></i></div><span class="b">${b}</span></div>`}).join("");
ch.innerHTML=chartSVG(284,190,{dot:"rgba(255,205,140,.22)",line:"#ffb547"});
chips.innerHTML=RECENT.slice().reverse().map(t=>`<div class="chip"><i style="height:${(t-10)*9}px"></i>${t}</div>`).join("");
</script></body></html>
