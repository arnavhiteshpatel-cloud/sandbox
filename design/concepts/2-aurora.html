<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{background:#030305}
.glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.55}
.g1{width:700px;height:520px;left:-160px;top:420px;background:#1b2a6b}.g2{width:620px;height:460px;right:-140px;top:-120px;background:#3a1d5c}.g3{width:520px;height:380px;right:220px;bottom:-220px;background:#0e4a52}
.glass{position:absolute;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:22px;backdrop-filter:blur(30px) saturate(140%);box-shadow:0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06)}
.scr{left:calc(50% + 110px);transform:translateX(-50%);top:56px;padding:16px 30px;font-size:24px;letter-spacing:.03em;word-spacing:.3em;color:#e8e8f0;white-space:nowrap}
.t{position:absolute;top:290px;left:350px;right:0;text-align:center;font-size:280px;font-weight:350;letter-spacing:-.04em;line-height:1}
.stats{left:28px;top:150px;width:290px;padding:18px 20px}
.stats h4,.card h4{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600}
.row{display:flex;justify-content:space-between;font-size:14.5px;padding:4.5px 0}.row span:first-child{color:rgba(255,255,255,.5)}.row .b{color:rgba(255,255,255,.45);width:56px;text-align:right}
.card{bottom:28px;padding:16px 20px}
.c1{left:350px;width:560px;height:170px}.c2{right:28px;width:300px;height:170px;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;left:28px;top:56px;display:flex;gap:6px}.nav span{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:block}
.nav span.on{background:rgba(255,255,255,.16)}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div class="tl"><i></i><i></i><i></i></div>
<div class="nav"><span class="on"></span><span></span><span></span><span></span><span></span></div>
<div class="glass scr mono" id="scr"></div>
<div class="glass stats"><h4>Session 1 · 3×3</h4><div id="rows"></div></div>
<div class="t num">12.93</div>
<div class="glass card c1"><h4>Last 200 · ao12</h4><div id="ch"></div></div>
<div class="glass card c2" id="net"></div>
<script type="module">import {SCRAMBLE,STATS,netSVG,chartSVG} from "./mock.js";scr.textContent=SCRAMBLE;net.innerHTML=netSVG(15);
rows.innerHTML=STATS.map(([l,c,b])=>`<div class="row num"><span>${l}</span><span style="flex:1;text-align:right">${c}</span><span class="b">${b}</span></div>`).join("");
ch.innerHTML=chartSVG(520,110,{dot:"rgba(255,255,255,.25)",line:"#b9c6ff"});</script>
</body></html>
