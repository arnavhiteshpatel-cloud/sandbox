<!doctype html>
<html><head><meta charset="utf-8"><title>Timer font specimens</title>
<script type="module">
import "@fontsource-variable/inter/opsz.css";
import "@fontsource-variable/geist/index.css";
import "@fontsource/ibm-plex-sans/300.css";
import "@fontsource/ibm-plex-sans/400.css";
import "@fontsource-variable/space-grotesk/index.css";
import "@fontsource-variable/dm-sans/index.css";
import "@fontsource-variable/manrope/index.css";
import "@fontsource-variable/outfit/index.css";
import "@fontsource-variable/jetbrains-mono/index.css";
import "@fontsource-variable/roboto-mono/index.css";
</script>
<style>
body{background:#000;color:#fff;margin:0;padding:28px 40px;font-family:'Inter Variable';-webkit-font-smoothing:antialiased}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 40px}
.c{border-top:1px solid #1c1c1e;padding:14px 0 10px;display:flex;align-items:baseline;gap:22px}
.n{width:150px;flex:none;color:#8e8e93;font-size:13px;line-height:1.4}
.n b{display:block;color:#fff;font-size:15px;font-weight:600;margin-bottom:2px}
.t{font-size:112px;line-height:1;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1{font-size:14px;font-weight:600;color:#8e8e93;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
</style></head><body>
<h1>Timer typeface options — all digits shown at the same size</h1>
<div class="grid" id="g"></div>
<script>
const F=[["A · Inter","'Inter Variable'",450,"Bundled. Neutral, crisp, very legible."],
["B · Geist","'Geist Variable'",400,"Bundled. Modern, slightly technical."],
["C · Helvetica-style","'Liberation Sans'",400,"Your current csTimer look (Arial/Helvetica)."],
["D · IBM Plex Sans","'IBM Plex Sans'",300,"Bundled. Light, engineered, elegant."],
["E · Space Grotesk","'Space Grotesk Variable'",400,"Bundled. Distinctive, geometric quirks."],
["F · DM Sans","'DM Sans Variable'",400,"Bundled. Soft, rounded geometric."],
["G · Manrope","'Manrope Variable'",400,"Bundled. Wide, calm, premium."],
["H · Outfit","'Outfit Variable'",300,"Bundled. Thin geometric, airy."],
["I · JetBrains Mono","'JetBrains Mono Variable'",400,"Bundled. Monospace, digits never shift."],
["J · Roboto Mono","'Roboto Mono Variable'",300,"Bundled. Lighter monospace."]];
document.getElementById('g').innerHTML=F.map(([n,f,w,d])=>`<div class="c"><div class="n"><b>${n}</b>${d}</div><div class="t" style="font-family:${f};font-weight:${w}">12.93</div><div class="t" style="font-family:${f};font-weight:${w};font-size:40px;color:#a1a1a6">14.07</div></div>`).join('');
</script></body></html>
